name: Build, Push to ECR, and Deploy ShopLite

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ACCOUNT_ID: 333399527674
  REGISTRY: 333399527674.dkr.ecr.ap-south-1.amazonaws.com

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short commit SHA
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all four service images
        env:
          TAG: ${{ steps.meta.outputs.short_sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${REGISTRY}/shoplite/frontend:${TAG}" \
            -f frontend/Dockerfile frontend --push

          docker buildx build --platform linux/amd64 \
            -t "${REGISTRY}/shoplite/catalog:${TAG}" \
            -f catalog-service/Dockerfile catalog-service --push

          docker buildx build --platform linux/amd64 \
            -t "${REGISTRY}/shoplite/inventory:${TAG}" \
            -f inventory-service/Dockerfile inventory-service --push

          docker buildx build --platform linux/amd64 \
            -t "${REGISTRY}/shoplite/orders:${TAG}" \
            -f order-service/Dockerfile order-service --push

  deploy-vm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/shoplite
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main

            export AWS_REGION="${{ env.AWS_REGION }}"
            export ACCOUNT_ID="${{ env.ACCOUNT_ID }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export TAG="${{ needs.build-and-push.outputs.short_sha }}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            for svc in frontend catalog inventory orders; do
              docker pull "${REGISTRY}/shoplite/${svc}:${TAG}"
            done

            ./scripts/up.sh
            SERVER_HOST="$(awk -F= '/^SERVER_NAME=/{print $2}' .env | tr -d '"' | tr -d "'")"
            SERVER_HOST="${SERVER_HOST:-shoplite.test}"
            curl -fsS -I -H "Host: ${SERVER_HOST}" http://127.0.0.1/ | head -n 5
